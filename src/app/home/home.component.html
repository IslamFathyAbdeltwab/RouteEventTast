

 <div class="w-full max-w-3xl mx-auto mt-10">
  <div class="flex items-center gap-4">
    
    <div class="relative flex-grow">
      <input
        (input)="search($event)"
        type="text"
        placeholder="Search..."
        class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
      />
      <svg
        class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M21.53 20.47l-4.85-4.85A7.952 7.952 0 0018 10a8 8 0 10-8 8 7.952 7.952 0 005.62-2.32l4.85 4.85a.75.75 0 101.06-1.06zM10 16a6 6 0 110-12 6 6 0 010 12z"
        />
      </svg>
    </div>




<div class="relative inline-block text-left group">

  <button
    class="inline-flex justify-center w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none"
  >
    Sort Product
    <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>


  <div
    class="hidden group-hover:block absolute right-0 mt-2 w-44 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50 transition-all duration-200"
  >
    <div class="py-1">
      <button
        class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
        (click)="sortByPrice()"
      >
        Sort by Price
      </button>
      <button
        class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
        (click)="sortByName()"
      >
        Sort by Name
      </button>
    </div>
  </div>
</div>



  </div>
</div>



<div class="grid grid-cols-1 mt-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 px-3 gap-6 ">

  @for (product of productRes; track product.id) {
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md overflow-hidden transition hover:shadow-lg flex flex-wrap flex-col justify-between ">

      
      <img [routerLink]="['/product',product.id]" [src]="product.image" alt="Product Image" class="w-full h-96 object-cover">

     
      <div class="p-4 space-y-2">

        
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ product.title.split(" ",3).join() }}</h3>

       
        <p class="text-sm text-gray-500 dark:text-gray-300">{{ product.description.split(" ",3).join(" ") }}</p>

       
        <div class="flex items-center justify-between pt-2">

          <span class="text-indigo-600 dark:text-indigo-400 font-bold text-base">
            {{ product.price  }}
          </span>

          
          <div class="text-yellow-500 text-sm flex items-center">
            @for (i of [1,2,3,4,5]; track $index)
             {
                @if(i<product.rating.rate){
                     <span>★</span>
                }
             }
          </div>

        </div>

      </div>
    </div>
  }

</div>
