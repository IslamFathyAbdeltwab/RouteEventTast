 <div class="max-w-4xl mx-auto p-6  bg-white rounded-2xl shadow-xl dark:bg-gray-900 dark:text-white">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
    
    
    <div class="w-full">
      <img [src]="productinfo.image" alt="{{ productinfo.title }}" class="rounded-xl w-full h-auto object-contain shadow-md">
    </div>
    
   
    <div class="space-y-4">
      <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
        {{ productinfo.title }}
      </h2>
      
      <p class="text-xl font-semibold text-indigo-600 dark:text-indigo-400">
        ${{ productinfo.price }}
      </p>
      
      <p class="text-gray-600 dark:text-gray-300 text-base leading-relaxed">
        {{ productinfo.description }}
      </p>

      <div class="text-sm text-gray-500 dark:text-gray-400">
        <span class="font-medium">Category:</span> {{ productinfo.category }}
      </div>
     

      
      <div class="pt-4">
        <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-medium transition">
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
